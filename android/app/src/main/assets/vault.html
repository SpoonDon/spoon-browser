<!DOCTYPE html>
<html style="background-color: #000000 !important;">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { background-color: transparent; }
        html, body { background: #000000 !important; background-color: #000000 !important; color: #ffffff !important; font-family: -apple-system, sans-serif; padding: 16px; margin: 0; }
        .search-bar { width: 100%; padding: 14px; box-sizing: border-box; background: #121212 !important; border: 1px solid #2d2d2d; border-radius: 10px; font-size: 16px; color: #fff !important; margin-bottom: 20px; outline: none; }
        .card { background: #121212 !important; border: 1px solid #1f1f1f; padding: 16px; border-radius: 10px; margin-bottom: 14px; }
        .host { font-weight: bold; font-size: 17px; color: #ffffff !important; margin-bottom: 4px; }
        .user { color: #aaaaaa !important; font-size: 14px; margin-bottom: 14px; }
        .actions { display: flex; gap: 8px; }
        button { background: #222222 !important; border: 1px solid #333333; padding: 10px 14px; border-radius: 8px; font-size: 13px; color: #cccccc !important; flex-grow: 1; cursor: pointer; }
        button.primary { background: #007bff !important; color: #fff !important; border-color: #007bff; }
        button.danger { background: #dc3545 !important; color: #fff !important; border-color: #dc3545; }
    </style>
</head>
<body>

    <h2 style="color: #fff !important; margin-top: 0;">Password Vault v2</h2>
    <input type="text" class="search-bar" id="search" placeholder="Search saved passwords..." oninput="renderCards()">
    <div id="vault-root"></div>

    <script>
        var allData = [];

        // Main entry point for the Android data layer injection fallback
        window.receiveNativeData = function(jsonString) {
            try {
                if (jsonString) {
                    allData = JSON.parse(jsonString);
                    renderCards();
                }
            } catch(e) {
                document.getElementById('vault-root').innerHTML = '<div style="color:red;">Parse Error: ' + e.message + '</div>';
            }
        };

        function renderCards() {
            var q = document.getElementById('search').value.toLowerCase();
            var root = document.getElementById('vault-root');
            root.innerHTML = '';

            if (!allData || allData.length === 0) {
                root.innerHTML = '<div style="text-align:center; color:#666; margin-top:40px;">No credentials found in database.</div>';
                return;
            }

            allData.forEach(function(item, idx) {
                if(item.host.toLowerCase().indexOf(q) === -1 && item.username.toLowerCase().indexOf(q) === -1) return;

                var card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = 
                    '<div class="host">' + item.host + '</div>' +
                    '<div class="user">User: ' + item.username + '</div>' +
                    '<div class="actions">' +
                        '<button class="primary">Copy Pass</button>' +
                        '<button class="danger">Delete</button>' +
                    '</div>';
                root.appendChild(card);
            });
        }
        
        renderCards();
    </script>
</body>
</html>
