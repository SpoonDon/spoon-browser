<!DOCTYPE html>
<html style="background-color: #000000 !important;">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { background-color: transparent; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        html, body { background: #000000 !important; color: #ffffff !important; padding: 16px; margin: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { color: #fff !important; margin: 0; }
        .btn { background: #222; border: 1px solid #333; padding: 10px 14px; border-radius: 8px; font-size: 13px; color: #ccc; cursor: pointer; }
        .btn.primary { background: #007bff; color: #fff; border-color: #007bff; }
        .btn.danger { background: #dc3545; color: #fff; border-color: #dc3545; }
        .btn.success { background: #28a745; color: #fff; border-color: #28a745; }
        .search-bar { width: 100%; padding: 14px; background: #121212 !important; border: 1px solid #2d2d2d; border-radius: 10px; font-size: 16px; color: #fff !important; margin-bottom: 20px; outline: none; }
        .card { background: #121212 !important; border: 1px solid #1f1f1f; padding: 16px; border-radius: 10px; margin-bottom: 14px; }
        .host { font-weight: bold; font-size: 17px; color: #ffffff !important; margin-bottom: 4px; }
        .user { color: #aaaaaa !important; font-size: 14px; margin-bottom: 14px; }
        .actions { display: flex; gap: 8px; }
        .actions .btn { flex: 1; }
        
        /* Modal Styles */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 1000; padding: 20px; align-items: center; justify-content: center; }
        .modal-content { background: #121212; border: 1px solid #333; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; }
        .modal-content input { width: 100%; padding: 12px; margin-bottom: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 15px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 10px; }
        .modal-actions .btn { flex: 1; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Vault</h2>
        <button class="btn success" onclick="openModal()">+ Add</button>
    </div>
    
    <input type="text" class="search-bar" id="search" placeholder="Search saved passwords..." oninput="renderCards()">
    <div id="vault-root"></div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-top: 0;">Add Credential</h3>
            <input type="text" id="m-host" placeholder="Website (e.g. google.com)">
            <input type="text" id="m-user" placeholder="Username / Email">
            <input type="password" id="m-pass" placeholder="Password">
            <div class="modal-actions">
                <button class="btn" onclick="closeModal()">Cancel</button>
                <button class="btn primary" onclick="saveData()">Save</button>
            </div>
        </div>
    </div>

    <script>
        var allData = [];
        var isEditing = false;
        var editOriginalHost = '';
        var editOriginalUser = '';

        // Modern Jetpack WebMessageListener Initialization
        window.onload = function() {
            if (typeof spoonVaultMessage !== 'undefined') {
                spoonVaultMessage.addEventListener('message', function(event) {
                    if (event.data) {
                        try {
                            allData = JSON.parse(event.data);
                            renderCards();
                        } catch(e) {
                            document.getElementById('vault-root').innerHTML = '<div style="color:red;">Error parsing data.</div>';
                        }
                    }
                });
                // Request data immediately on load
                spoonVaultMessage.postMessage('FETCH_ALL_VAULT_DATA');
            } else {
                document.getElementById('vault-root').innerHTML = '<div style="color:#666; text-align:center; margin-top:40px;">Waiting for native bridge...</div>';
            }
        };

        function renderCards() {
            var q = document.getElementById('search').value.toLowerCase();
            var root = document.getElementById('vault-root');
            root.innerHTML = '';

            if (!allData || allData.length === 0) {
                root.innerHTML = '<div style="text-align:center; color:#666; margin-top:40px;">No credentials found.</div>';
                return;
            }

            allData.forEach(function(item, idx) {
                if(item.host.toLowerCase().indexOf(q) === -1 && item.username.toLowerCase().indexOf(q) === -1) return;

                var card = document.createElement('div');
                card.className = 'card';

                // Natively secure DOM creation to prevent XSS injection
                var hostDiv = document.createElement('div');
                hostDiv.className = 'host';
                hostDiv.textContent = item.host;

                var userDiv = document.createElement('div');
                userDiv.className = 'user';
                userDiv.textContent = item.username;

                var actionsDiv = document.createElement('div');
                actionsDiv.className = 'actions';
                actionsDiv.innerHTML = 
                    '<button class="btn" onclick="copyPass(' + idx + ', this)">Copy Pass</button>' +
                    '<button class="btn" onclick="editCard(' + idx + ')">Edit</button>' +
                    '<button class="btn danger" onclick="deleteCard(' + idx + ')">Del</button>';

                card.appendChild(hostDiv);
                card.appendChild(userDiv);
                card.appendChild(actionsDiv);
                root.appendChild(card);
            });
        }

        function copyPass(idx, btnElement) {
            var pass = allData[idx].password;
            if(pass) {
                var triggerSuccessUI = function() {
                    var originalText = btnElement.innerText;
                    btnElement.innerText = "Copied!";
                    btnElement.style.background = "#28a745";
                    setTimeout(function() {
                        btnElement.innerText = originalText;
                        btnElement.style.background = "#222";
                    }, 1500);
                };

                if (navigator.clipboard) {
                    navigator.clipboard.writeText(pass).then(function() {
                        triggerSuccessUI();
                    }).catch(function() {
                        fallbackCopy(pass, triggerSuccessUI);
                    });
                } else {
                    fallbackCopy(pass, triggerSuccessUI);
                }
            }
        }

        function fallbackCopy(pass, successCallback) {
            var temp = document.createElement("input");
            temp.value = pass;
            document.body.appendChild(temp);
            temp.select();
            try {
                document.execCommand("copy");
                successCallback();
            } catch (err) {
                console.error("Fallback copy failed");
            }
            document.body.removeChild(temp);
        }

        function deleteCard(idx) {
            if(confirm("Delete this saved password?")) {
                var item = allData[idx];
                if(typeof spoonVaultMessage !== 'undefined') {
                    spoonVaultMessage.postMessage(JSON.stringify({ action: 'DELETE_LOGIN', host: item.host, username: item.username }));
                }
                allData.splice(idx, 1);
                renderCards();
            }
        }

        function openModal() {
            isEditing = false;
            document.getElementById('modal-title').innerText = "Add Credential";
            document.getElementById('m-host').value = '';
            document.getElementById('m-user').value = '';
            document.getElementById('m-pass').value = '';
            document.getElementById('modal').style.display = 'flex';
        }

        function editCard(idx) {
            isEditing = true;
            var item = allData[idx];
            editOriginalHost = item.host;
            editOriginalUser = item.username;
            
            document.getElementById('modal-title').innerText = "Edit Credential";
            document.getElementById('m-host').value = item.host;
            document.getElementById('m-user').value = item.username;
            document.getElementById('m-pass').value = item.password || '';
            
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function saveData() {
            var h = document.getElementById('m-host').value.trim();
            var u = document.getElementById('m-user').value.trim();
            var p = document.getElementById('m-pass').value;

            if(!h || !u || !p) return;

            if(typeof spoonVaultMessage !== 'undefined') {
                if (isEditing && (h !== editOriginalHost || u !== editOriginalUser)) {
                    spoonVaultMessage.postMessage(JSON.stringify({ action: 'DELETE_LOGIN', host: editOriginalHost, username: editOriginalUser }));
                }
                spoonVaultMessage.postMessage(JSON.stringify({ action: 'SAVE_LOGIN', host: h, username: u, password: p }));
            }

            if (isEditing) {
                var found = allData.find(i => i.host === editOriginalHost && i.username === editOriginalUser);
                if(found) { found.host = h; found.username = u; found.password = p; }
            } else {
                allData.push({host: h, username: u, password: p});
            }

            closeModal();
            renderCards();
        }
    </script>
</body>
</html>
