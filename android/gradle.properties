# ---------------------------------------------------------------------------
# Spoon Browser - Gradle build properties
# ---------------------------------------------------------------------------

# JVM args for the Gradle daemon.
# AGP 8.13 + R8 + shrinkResources needs headroom; 1.5 GB is not enough.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# AndroidX
android.useAndroidX=true
android.enableJetifier=false

# Non-transitive R class + non-final resource IDs
# (faster incremental builds, smaller APK, better R8 optimization)
android.nonTransitiveRClass=true
android.nonFinalResIds=true
