// ---------------------------------------------------------------------------
// Force Java 21 compatibility across all Android modules.
//
// Why 21 and not 17:
//   - Capacitor 8.x (@capacitor/android) declares Java 21 source/target
//     in its own build.gradle and in the generated capacitor.build.gradle.
//   - AGP 8.13 fully supports Java 21.
//   - Mixing 17 and 21 across modules leads to non-deterministic build
//     outcomes depending on apply order.
// ---------------------------------------------------------------------------

allprojects {
    tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_21
                    targetCompatibility JavaVersion.VERSION_21
                }
            }
        }
    }
}

// Belt-and-suspenders: prevent any module from silently downgrading.
tasks.withType(JavaCompile).configureEach {
    options.release = 21
}
