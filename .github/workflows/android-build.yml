name: Build Android APK

on:
  push:
    branches:
      - main
      - "feature/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------- NODE ----------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      # ---------------- INSTALL ----------------
      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli

      - name: Verify Capacitor
        run: npx cap --version

      # ---------------- BUILD WEB ----------------
      - name: Build web assets
        run: npm run build || echo "No build step found"

      # ---------------- ANDROID SYNC ----------------
      - name: Sync Capacitor
        run: npx cap sync android

      # ---------------- JAVA ----------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Force Gradle Java Home
        run: echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties

      - name: Restore signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > spoon-browser.jks

      - name: Create keystore.properties
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=../spoon-browser.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Verify keystore exists
        run: |
          ls -lh spoon-browser.jks
          ls -lh android/keystore.properties

      # ---------------- BUILD APK ----------------
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # ---------------- UPLOAD APK ----------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spoon-browser-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
