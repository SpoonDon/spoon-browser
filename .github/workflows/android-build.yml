# .github/workflows/android-build.yml
name: Android Release Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./android/gradlew
        working-directory: ./android

      - name: Decode and set up keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ./android/keystore.jks
          else
            echo "No keystore secret found; skipping signing (debug-only build)."
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_FILE: ${{ secrets.SIGNING_STORE_FILE || 'keystore.jks' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # Build release variant
          ./android/gradlew assembleRelease
        working-directory: ./android

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: spoon-browser-release
          path: android/app/build/outputs/apk/release/*.apk
