name: Build Android APK

on:
  push:
    branches:
      - main
      - "feature/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------- NODE ----------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      # ---------------- INSTALL ----------------
      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli

      - name: Verify Capacitor
        run: npx cap --version

      # ---------------- BUILD WEB ----------------
      - name: Build web assets
        run: npm run build || echo "No build step found"

      # ---------------- ANDROID SYNC ----------------
      - name: Sync Capacitor
        run: npx cap sync android

      # ---------------- JAVA ----------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Force Gradle Java Home
        run: echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties

      - name: Restore signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > spoon-browser.jks

      - name: Show keystore SHA256
        run: |
          sha256sum spoon-browser.jks

      - name: Verify keystore can be opened
        run: |
          keytool -list -v \
            -keystore spoon-browser.jks \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}"


      - name: Create keystore.properties
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=${GITHUB_WORKSPACE}/spoon-browser.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Verify keystore properties
        run: |
          sed 's/=.*$/=***/' android/keystore.properties

      - name: Verify keystore exists
        run: |
          ls -lh spoon-browser.jks
          ls -lh android/keystore.properties

      - name: Verify signing files
        run: |
          pwd
          ls -lh
          ls -lh android
          cat android/keystore.properties

      # ---------------- BUILD APK ----------------
      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: List APK outputs
        run: |
          find android/app/build/outputs -type f

      - name: Show release metadata
        run: |
          cat android/app/build/outputs/apk/release/output-metadata.json

      # ---------------- UPLOAD APK ----------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spoon-browser-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
