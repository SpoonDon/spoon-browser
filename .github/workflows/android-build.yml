name: Android Build

on:
  push:
    branches: [ main, feature/media-and-passwords, feature/ui-overhaul ]
    tags:
      - 'v*'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up NodeJS Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Sync Capacitor
        run: |
          npm ci
          npx cap sync android

      - name: Make Gradlew Executable
        run: |
          if [ -f ./android/gradlew ]; then chmod +x ./android/gradlew; fi

      - name: Build Release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNING_STORE_FILE: "../release.keystore"
        run: |
          set -e
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/release.keystore || echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" > android/release.keystore
          cd android
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Upload Compiled Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spoon-browser-release-apk
          path: android/app/build/outputs/apk/release/*.apk

