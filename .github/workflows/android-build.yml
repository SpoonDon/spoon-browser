name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up NodeJS Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Sync Capacitor
        run: |
          npm ci
          npx cap sync android

      - name: Make Gradlew Executable
        run: |
          if [ -f ./android/gradlew ]; then chmod +x ./android/gradlew; fi

      - name: Build Release APK
        env:
          # Inject your GitHub Secrets into the environment variables expected by build.gradle
          SIGNING_STORE_FILE: ${{ secrets.SIGNING_STORE_FILE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -e
          cd android
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Upload Compiled Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spoon-browser-release-apk
          path: android/app/build/outputs/apk/release/*.apk

