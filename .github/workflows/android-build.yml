name: Android Release Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Decode and validate keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
          if ! keytool -list -keystore android/release.keystore \
                 -storepass "$SIGNING_STORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::Keystore decode failed or wrong password"
            exit 1
          fi

      - name: Build Release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNING_STORE_FILE: "../release.keystore"
        run: |
          cd android
          ./gradlew clean assembleRelease --stacktrace

      - name: Cleanup keystore
        if: always()
        run: rm -f android/release.keystore

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: spoon-browser-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
