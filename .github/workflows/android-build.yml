name: Android Release Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

# Cancel prior runs on the same ref. Tag builds and branch builds are
# different refs, so a v1.0.0 tag push will not cancel a running main build
# (and vice versa) — which is correct: you want the release to complete
# even if someone pushes to main at the same moment.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed by softprops/action-gh-release to create/update the release
    # and upload assets.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Decode and validate keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
          if ! keytool -list -keystore android/release.keystore \
                 -storepass "$SIGNING_STORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::Keystore decode failed or wrong password"
            exit 1
          fi

      - name: Build Release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNING_STORE_FILE: "../release.keystore"
        run: |
          set -euo pipefail
          cd android
          ./gradlew clean assembleRelease --stacktrace

      - name: Cleanup keystore
        if: always()
        run: rm -f android/release.keystore

      # Rename the APK so tag builds and main builds are distinguishable
      # when downloaded together, and so the release asset name is
      # human-friendly.
      - name: Prepare APK
        id: prep
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            SUFFIX="${GITHUB_REF#refs/tags/}"
          else
            SUFFIX="${GITHUB_SHA::7}"
          fi

          mkdir -p out
          for apk in android/app/build/outputs/apk/release/*.apk; do
            base=$(basename "$apk" .apk)
            cp "$apk" "out/SpoonBrowser-${base}-${SUFFIX}.apk"
          done
          ls -la out/

      # Artifact download is ALWAYS a zip — GitHub wraps every artifact
      # at the platform level. Use the Release asset below for a raw .apk.
      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spoon-browser-release-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      # On tag pushes, attach the APK(s) directly to a GitHub Release.
      # Release asset downloads serve the raw .apk file — no zip wrapper.
      # Link format:
      #   https://github.com/<owner>/<repo>/releases/download/<tag>/<apk>
      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
