name: Build APK

on:
  push:
    branches: [ 'fix/autocomplete-popup' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: |
          if [ -f ./android/gradlew ]; then chmod +x ./android/gradlew; fi

      - name: Decode and set up keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ./android/keystore.jks
          else
            echo "⚠️ No keystore secret found; the APK will be unsigned (cannot be installed)."
          fi

      - name: Build Release APK
        env:
          SIGNING_STORE_FILE: ${{ secrets.SIGNING_STORE_FILE || 'keystore.jks' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -e
          cd android
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spoon-browser-release-apk
          path: android/app/build/outputs/apk/release/*.apk
