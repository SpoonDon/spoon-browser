<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spoon Browser</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #111;
    }

    #bar {
      display: flex;
      padding: 8px;
      background: #1a1a1a;
    }

    input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      outline: none;
    }

    button {
      margin-left: 6px;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #333;
      color: white;
    }

    iframe {
      flex: 1;
      border: none;
      width: 100%;
      background: white;
    }
  </style>
</head>

<body>

<div id="bar">
  <input id="url" placeholder="Search or enter URL" />
  <button onclick="go()">Go</button>
  <button onclick="back()">←</button>
  <button onclick="forward()">→</button>
  <button onclick="reload()">⟳</button>
</div>

<iframe id="web"></iframe>

<script>
  const frame = document.getElementById("web");

  function go() {
    let url = document.getElementById("url").value;

    if (!url.startsWith("http")) {
      url = "https://" + url;
    }

    frame.src = url;
  }

  function back() {
    frame.contentWindow.history.back();
  }

  function forward() {
    frame.contentWindow.history.forward();
  }

  function reload() {
    frame.src = frame.src;
  }
</script>

</body>
</html>
