<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spoon Browser</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #111;
    }

    #topbar {
      display: flex;
      padding: 8px;
      background: #1a1a1a;
      gap: 6px;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: none;
      outline: none;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #333;
      color: white;
    }

    #status {
      color: #aaa;
      font-size: 12px;
      padding: 4px 8px;
      background: #0f0f0f;
    }

    iframe {
      flex: 1;
      border: none;
      background: white;
    }
  </style>
</head>

<body>

<div id="topbar">
  <button onclick="back()">←</button>
  <button onclick="forward()">→</button>
  <button onclick="reload()">⟳</button>

  <input id="url" placeholder="Search or enter URL" />
  <button onclick="go()">Go</button>
</div>

<div id="status">Ready</div>

<iframe id="web"></iframe>

<script>
  const frame = document.getElementById("web");
  const urlBar = document.getElementById("url");
  const status = document.getElementById("status");

  function normalize(url) {
    if (!url.startsWith("http")) {
      return "https://" + url;
    }
    return url;
  }

  function go() {
    let url = normalize(urlBar.value);
    frame.src = url;
    status.innerText = "Loading...";
  }

  function back() {
    frame.contentWindow.history.back();
  }

  function forward() {
    frame.contentWindow.history.forward();
  }

  function reload() {
    frame.src = frame.src;
  }

  frame.onload = () => {
    status.innerText = "Loaded";
    try {
      urlBar.value = frame.contentWindow.location.href;
    } catch (e) {
      urlBar.value = frame.src;
    }
  };
</script>

</body>
</html>
