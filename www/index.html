<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spoon Browser</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #111;
      color: white;
    }

    #bar {
      display: flex;
      gap: 6px;
      padding: 8px;
      background: #1a1a1a;
    }

    input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      outline: none;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #333;
      color: white;
    }

    #status {
      padding: 6px 10px;
      font-size: 12px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

<div id="bar">
  <button onclick="back()">←</button>
  <button onclick="forward()">→</button>
  <input id="url" placeholder="Enter URL or search" onkeydown="if(event.key==='Enter') go()" />
  <button onclick="go()">Go</button>
</div>

<div id="status">Ready</div>

<script>
  let historyStack = [];
  let index = -1;

  function resolve(input) {
    input = input.trim();

    if (!input) return "";

    if (input.includes(".") && !input.includes(" ")) {
      if (!input.startsWith("http")) return "https://" + input;
      return input;
    }

    return "https://duckduckgo.com/?q=" + encodeURIComponent(input);
  }

  function go() {
    const url = resolve(document.getElementById("url").value);

    if (!url) return;

    historyStack = historyStack.slice(0, index + 1);
    historyStack.push(url);
    index++;

    load(url);
  }

  function load(url) {
    document.getElementById("status").innerText = "Loading: " + url;
    window.location.href = url;
  }

  function back() {
    if (index > 0) {
      index--;
      load(historyStack[index]);
    }
  }

  function forward() {
    if (index < historyStack.length - 1) {
      index++;
      load(historyStack[index]);
    }
  }
</script>

</body>
</html>
