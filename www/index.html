<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spoon Browser</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #111;
      color: white;
    }

    #bar {
      display: flex;
      padding: 8px;
      background: #1a1a1a;
      gap: 6px;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: none;
      outline: none;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #333;
      color: white;
    }

    #view {
      width: 100%;
      height: calc(100vh - 60px);
      border: none;
      background: white;
    }
  </style>
</head>

<body>

<div id="bar">
  <button onclick="back()">←</button>
  <button onclick="forward()">→</button>
  <input id="url" placeholder="Search or URL" onkeydown="if(event.key==='Enter') go()" />
  <button onclick="go()">Go</button>
</div>

<iframe id="view"></iframe>

<script>
  const view = document.getElementById("view");

  function resolve(input) {
    input = input.trim();

    if (!input) return "";

    if (input.includes(".") && !input.includes(" ")) {
      if (!input.startsWith("http")) return "https://" + input;
      return input;
    }

    return "https://duckduckgo.com/?q=" + encodeURIComponent(input);
  }

  function go() {
    const input = document.getElementById("url").value;
    view.src = resolve(input);
  }

  function back() {
    view.contentWindow.history.back();
  }

  function forward() {
    view.contentWindow.history.forward();
  }
</script>

</body>
</html>
