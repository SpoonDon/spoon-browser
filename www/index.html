<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spoon Browser</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #111;
    }

    #bar {
      display: flex;
      padding: 8px;
      background: #1a1a1a;
      gap: 6px;
    }

    input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      outline: none;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #333;
      color: white;
    }

    iframe {
      flex: 1;
      border: none;
      background: white;
    }
  </style>
</head>

<body>

<div id="bar">
  <button onclick="back()">←</button>
  <button onclick="forward()">→</button>
  <button onclick="reload()">⟳</button>

  <input id="url" placeholder="Search or enter URL" onkeydown="if(event.key==='Enter') go()" />
  <button onclick="go()">Go</button>
</div>

<iframe id="web"></iframe>

<script>
  const frame = document.getElementById("web");

  function isURL(t) {
    return t.includes(".") && !t.includes(" ");
  }

  function resolve(input) {
    if (!input) return "";

    if (isURL(input)) {
      if (!input.startsWith("http")) return "https://" + input;
      return input;
    }

    return "https://duckduckgo.com/?q=" + encodeURIComponent(input);
  }

  function go() {
    frame.src = resolve(document.getElementById("url").value);
  }

  function back() {
    frame.contentWindow.history.back();
  }

  function forward() {
    frame.contentWindow.history.forward();
  }

  function reload() {
    frame.src = frame.src;
  }
</script>

</body>
</html>
