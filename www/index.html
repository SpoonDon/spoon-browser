<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spoon Browser</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #111;
      color: white;
    }

    #bar {
      display: flex;
      gap: 6px;
      padding: 8px;
      background: #1a1a1a;
    }

    input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      outline: none;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #333;
      color: white;
    }

    #status {
      padding: 6px 10px;
      font-size: 12px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

<div id="bar">
  <button onclick="back()">←</button>
  <button onclick="forward()">→</button>
  <input id="url" placeholder="Enter URL or search" onkeydown="if(event.key==='Enter') go()" />
  <button onclick="go()">Go</button>
</div>

<div id="status">Ready</div>

<script src="https://unpkg.com/@capacitor/core@latest/dist/capacitor.js"></script>
<script src="https://unpkg.com/@capacitor/storage@latest/dist/storage.umd.js"></script>

<script>
  const { Storage } = window.CapacitorStorage;
  
  // In-memory cache for performance
  let historyStack = [];
  let index = -1;
  const STORAGE_KEY = "spoon_browser_history";
  const MAX_HISTORY_SIZE = 100;

  /**
   * Initialize history from encrypted storage on app load
   */
  async function initHistory() {
    try {
      const stored = await Storage.get({ key: STORAGE_KEY });
      if (stored && stored.value) {
        const data = JSON.parse(stored.value);
        historyStack = data.stack || [];
        index = data.index !== undefined ? data.index : -1;
        document.getElementById("status").innerText = `History loaded: ${historyStack.length} items`;
      }
    } catch (error) {
      console.warn("Failed to load history:", error);
      // Fall back to empty history on error
      historyStack = [];
      index = -1;
    }
  }

  /**
   * Save history to encrypted device storage
   */
  async function saveHistory() {
    try {
      // Limit history size to prevent unbounded growth
      if (historyStack.length > MAX_HISTORY_SIZE) {
        historyStack = historyStack.slice(-MAX_HISTORY_SIZE);
        index = Math.min(index, historyStack.length - 1);
      }

      const data = {
        stack: historyStack,
        index: index,
        timestamp: new Date().toISOString()
      };
      
      await Storage.set({
        key: STORAGE_KEY,
        value: JSON.stringify(data)
      });
    } catch (error) {
      console.error("Failed to save history:", error);
      document.getElementById("status").innerText = "Error: Could not save history";
    }
  }

  /**
   * Clear all browsing history (user action)
   */
  async function clearHistory() {
    try {
      await Storage.remove({ key: STORAGE_KEY });
      historyStack = [];
      index = -1;
      document.getElementById("status").innerText = "History cleared";
    } catch (error) {
      console.error("Failed to clear history:", error);
    }
  }

  function resolve(input) {
    input = input.trim();

    if (!input) return "";

    if (input.includes(".") && !input.includes(" ")) {
      if (!input.startsWith("http")) return "https://" + input;
      return input;
    }

    // Use URL API for proper query parameter encoding
    const searchUrl = new URL("https://duckduckgo.com/");
    searchUrl.searchParams.set("q", input);
    return searchUrl.toString();
  }

  function go() {
    const url = resolve(document.getElementById("url").value);

    if (!url) {
      document.getElementById("status").innerText = "Error: Invalid input";
      return;
    }

    historyStack = historyStack.slice(0, index + 1);
    historyStack.push(url);
    index++;

    saveHistory();
    load(url);
  }

  function load(url) {
    document.getElementById("status").innerText = "Loading: " + url;
    window.location.href = url;
  }

  function back() {
    if (index > 0) {
      index--;
      load(historyStack[index]);
    }
  }

  function forward() {
    if (index < historyStack.length - 1) {
      index++;
      load(historyStack[index]);
    }
  }

  // Initialize history from storage when page loads
  document.addEventListener("DOMContentLoaded", initHistory);
</script>

</body>
</html>
